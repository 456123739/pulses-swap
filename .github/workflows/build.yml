name: build

# 推送 tag（v*）时构建安装包并自动发布 Release；
# 手动触发（workflow_dispatch）只出 artifact，方便先验证。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────── Windows 安装器 ─────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 语法自检
        run: python -m py_compile src/pulses_swap.py

      - name: PyInstaller 打包
        run: pyinstaller packaging/pulses_swap.spec --noconfirm --clean

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          # 打 tag 构建时以 tag 为准（v2.1.1 → 2.1.1），否则读源码里的 VERSION。
          # 否则会出现"tag 是 v2.1.1、安装包却叫 Setup-2.1"的错位，下载的人会困惑。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(python -c "import re,pathlib;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',pathlib.Path('src/pulses_swap.py').read_text(encoding='utf-8')).group(1))")
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "版本号: $V"

      - name: 编译安装器
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "packaging\installer.iss" "/DMyAppVersion=${{ steps.ver.outputs.version }}"

      - name: 打包绿色版（免安装，解压即用）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          # 绿色版说明：数据目录优先级本来就是「程序目录可写 → 写在程序旁边」
          @"
          Pulses Swap 绿色版 v$v
          ============================
          1. 解压到任意目录（U 盘、桌面都行，不需要安装）
          2. 双击 PulsesSwap.exe 运行
          3. 预设 / 数据库 / 设置都存在同目录的 PulsesSwap_database\ 里，
             整个文件夹拷走即可带走全部数据；删掉文件夹即卸载干净
             （不写注册表、不写系统目录）

          注意：如果放在 C:\Program Files 这类没有写权限的位置，
          程序会自动把数据改存到 %LOCALAPPDATA%\PulsesSwap，
          想保持绿色特性请解压到用户目录或 U 盘。
          "@ | Out-File -Encoding utf8 dist/portable/使用说明.txt
          Compress-Archive -Path dist/PulsesSwap/*, dist/portable/使用说明.txt `
            -DestinationPath "dist/portable/PulsesSwap-Portable-$v.zip" -Force
          Get-Item "dist/portable/PulsesSwap-Portable-$v.zip" |
            Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Setup-Windows
          path: dist/installer/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Portable-Windows
          path: dist/portable/*.zip
          if-no-files-found: error

  # ───────────────────────── Linux 单文件版 ─────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装系统依赖（Tk + tkdnd）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 语法自检
        run: python -m py_compile src/pulses_swap.py

      - name: PyInstaller 打包
        run: pyinstaller packaging/pulses_swap.spec --noconfirm --clean

      - name: 冒烟测试（源码 import）
        run: |
          xvfb-run -a python -c "
          import sys; sys.path.insert(0,'src')
          import pulses_swap as m
          print('import ok, VERSION =', m.VERSION)
          "

      - name: 冒烟测试（真正跑打包后的可执行文件）
        run: |
          set +e
          timeout 12 xvfb-run -a ./dist/PulsesSwap/PulsesSwap
          code=$?
          # 124 = 被 timeout 掐掉，说明窗口起来了并一直活着，这正是我们要的
          if [ $code -eq 124 ]; then
            echo "OK: 打包产物启动成功并持续运行"
          else
            echo "FAIL: 打包产物提前退出，exit code = $code"
            exit 1
          fi

      - name: 打包为 tar.gz
        run: |
          cd dist
          tar -czf PulsesSwap-linux-x86_64.tar.gz PulsesSwap

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Linux
          path: dist/PulsesSwap-linux-x86_64.tar.gz
          if-no-files-found: error

  # ───────────────────────── 发布 Release ─────────────────────────
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          name: Pulses Swap ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
