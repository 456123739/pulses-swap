name: build

# 推送 tag（v*）时构建安装包并自动发布 Release；
# 手动触发（workflow_dispatch）只出 artifact，方便先验证。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "同时构建 macOS（默认关闭；mac 版暂时不发布）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ───────────────────────── Windows 安装器 ─────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 语法自检
        run: python -m py_compile src/pulses_swap.py

      - name: PyInstaller 打包
        run: pyinstaller packaging/pulses_swap.spec --noconfirm --clean

      - name: 检查产物（图标 / 在线模块）
        shell: pwsh
        run: |
          $exe = "dist/PulsesSwap/PulsesSwap.exe"
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          foreach ($f in @("icon.ico", "icon.png")) {
            if (-not (Test-Path "dist/PulsesSwap/_internal/$f")) { throw "打包产物里缺少 $f" }
          }
          Write-Host ("exe: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          # 打 tag 构建时以 tag 为准（v2.1.1 → 2.1.1），否则读源码里的 VERSION。
          # 否则会出现"tag 是 v2.1.1、安装包却叫 Setup-2.1"的错位，下载的人会困惑。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            # VERSION 只在 core/paths.py 里定义一处（拆分后不再是 pulses_swap.py）
            V=$(python -c "import re,pathlib;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',pathlib.Path('src/pulses/core/paths.py').read_text(encoding='utf-8')).group(1))")
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "版本号: $V"

      - name: 编译安装器
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "packaging\installer.iss" "/DMyAppVersion=${{ steps.ver.outputs.version }}"

      - name: 打包绿色版（免安装，解压即用，带空数据库）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "dist/portable/PulsesSwap-$v"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 1) 绿色版本体（exe + _internal）
          Copy-Item -Path "dist/PulsesSwap/*" -Destination $stage -Recurse -Force

          # 2) 空数据库结构：程序旁边发现 PulsesSwap_database 就直接用它。
          #    用单引号字符串 + WriteAllText(UTF8 无 BOM)：双引号会被 PowerShell
          #    的转义吃掉，Out-File 还会加 BOM，JSON 解析都会挂。
          $db = Join-Path $stage "PulsesSwap_database"
          New-Item -ItemType Directory -Force -Path $db | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $settingsJson = '{"storage_mode": "isolated", "role": "player"}'
          $globalJson = '{"recent_packs": []}'
          [IO.File]::WriteAllText((Join-Path $db ".settings.json"), $settingsJson, $utf8)
          [IO.File]::WriteAllText((Join-Path $db ".global.json"), $globalJson, $utf8)

          # 3) 使用说明
          @"
          Pulses Swap 绿色版 v$v
          ============================
          1. 解压到任意目录（U 盘、桌面都行，不需要安装）
          2. 双击 PulsesSwap.exe 运行
          3. 预设 / 数据库 / 设置都存在同目录的 PulsesSwap_database\ 里，
             整个文件夹拷走即可带走全部数据；删掉文件夹即卸载干净
             （不写注册表、不写系统目录）
          4. 这个包里已经带好一个空数据库，双击就能用；
             第一次选完整合包会自动生成一个 default 预设。

          注意：如果放在 C:\Program Files 这类没有写权限的位置，
          程序会自动把数据改存到 %LOCALAPPDATA%\PulsesSwap，
          想保持绿色特性请解压到用户目录或 U 盘。
          "@ | Out-File -Encoding utf8 (Join-Path $stage "使用说明.txt")

          # 4) 压缩：exe 在 zip 根目录，解压即见
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/portable/PulsesSwap-Portable-$v.zip" -Force
          Get-Item "dist/portable/PulsesSwap-Portable-$v.zip" |
            Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Setup-Windows
          path: dist/installer/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Portable-Windows
          path: dist/portable/*.zip
          if-no-files-found: error

  # ───────────────────────── macOS（Intel / Apple Silicon）─────────────────────────
  # 用户以 Win10/Win11 为主，mac 用户少但确实有，两个架构各出一份，
  # 否则 Intel Mac 拿到 arm64 包会直接「已损坏，无法打开」。
  macos:
    # mac 版暂时不搞：只有手动触发并勾选 macos 才构建；
    # tag 发布不会等它，也不会把 mac 产物放进 Release。
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.macos == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13          # Intel
            arch: x86_64
          - os: macos-14          # Apple Silicon
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 语法自检
        run: python -m py_compile src/pulses_swap.py

      - name: PyInstaller 打包（生成 .app）
        run: pyinstaller packaging/pulses_swap.spec --noconfirm --clean

      - name: 检查产物（.app / 图标）
        run: |
          test -d "dist/PulsesSwap.app" || { echo "没有生成 PulsesSwap.app"; exit 1; }
          ls -la "dist/PulsesSwap.app/Contents/MacOS"
          ls -la "dist/PulsesSwap.app/Contents/Resources" | head
          test -f "dist/PulsesSwap.app/Contents/Resources/icon-windowed.icns" \
            || echo "警告：.app 里没找到 icns（Dock 图标可能退回默认）"

      - name: 冒烟测试（.app 里的可执行文件能起来）
        run: |
          set +e
          timeout 15 "dist/PulsesSwap.app/Contents/MacOS/PulsesSwap"
          code=$?
          # 124 = 被 timeout 掐掉，说明窗口起来了并一直活着，这正是我们要的
          if [ $code -eq 124 ]; then
            echo "OK: 打包产物启动成功并持续运行"
          else
            echo "FAIL: 打包产物提前退出，exit code = $code"
            exit 1
          fi

      - name: 压缩（ditto 保留 .app 的符号链接与权限）
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/PulsesSwap.app" \
            "dist/PulsesSwap-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-macOS-${{ matrix.arch }}
          path: dist/PulsesSwap-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  # ───────────────────────── Linux 单文件版 ─────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装系统依赖（Tk + tkdnd）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 语法自检
        run: python -m py_compile src/pulses_swap.py

      - name: PyInstaller 打包
        run: pyinstaller packaging/pulses_swap.spec --noconfirm --clean

      - name: 冒烟测试（源码 import）
        run: |
          xvfb-run -a python -c "
          import sys; sys.path.insert(0,'src')
          import pulses_swap as m
          print('import ok, VERSION =', m.VERSION)
          "

      - name: 冒烟测试（真正跑打包后的可执行文件）
        run: |
          set +e
          timeout 12 xvfb-run -a ./dist/PulsesSwap/PulsesSwap
          code=$?
          # 124 = 被 timeout 掐掉，说明窗口起来了并一直活着，这正是我们要的
          if [ $code -eq 124 ]; then
            echo "OK: 打包产物启动成功并持续运行"
          else
            echo "FAIL: 打包产物提前退出，exit code = $code"
            exit 1
          fi

      - name: 打包为 tar.gz
        run: |
          cd dist
          tar -czf PulsesSwap-linux-x86_64.tar.gz PulsesSwap

      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Linux
          path: dist/PulsesSwap-linux-x86_64.tar.gz
          if-no-files-found: error

  # ───────────────────────── 发布 Release ─────────────────────────
  release:
    # 只等 Windows + Linux。mac 版暂时不发布：默认不构建，
    # 手动触发并勾选 macos 时才出 artifact，且永远不进 Release。
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: 源码包
        run: |
          git archive --format=zip --prefix=PulsesSwap/ \
            -o "release/PulsesSwap-src-${GITHUB_REF_NAME}.zip" HEAD
          ls -lh release/PulsesSwap-src-*.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: Pulses Swap ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
