name: build-web

on:
  push:
    tags: ["v3*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建前端
        working-directory: src/pulses_web/web
        run: |
          npm ci --include=dev
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt pyinstaller
      - name: 核心测试
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
      - name: 安装 Playwright Chromium
        working-directory: src/pulses_web/web
        run: npx playwright install chromium
      - name: 黑盒 UI 测试
        working-directory: src/pulses_web/web
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","-d","dist" -PassThru
          Start-Sleep -Seconds 1
          try {
            node test-ui.mjs
            node test-layout.mjs
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }
      - name: PyInstaller
        run: pyinstaller packaging/pulses_web.spec --noconfirm --clean
      - name: 检查产物
        shell: pwsh
        run: |
          $exe = "dist/PulsesSwap/PulsesSwap.exe"
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          if (-not (Test-Path "dist/PulsesSwap/_internal/pulses_web/web/dist/index.html")) {
            throw "前端产物没有打进 exe 目录"
          }
          Write-Host ("exe: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))
      - name: Windows WebView 实操自测
        shell: pwsh
        run: |
          $pack = Join-Path $PWD "selftest-pack"
          New-Item -ItemType Directory -Force -Path (Join-Path $pack "tacz") | Out-Null
          Set-Content -Path (Join-Path $pack "tacz\ci-gun.zip") -Value "ci-selftest" -NoNewline
          $result = Join-Path $PWD "selftest-result.json"
          $env:PULSES_WEB_SELFTEST = $result
          $env:PULSES_WEB_SELFTEST_JS = Join-Path $PWD "packaging\web_selftest.js"
          $env:PULSES_SELFTEST_PACK = $pack
          $env:PULSES_WEB_CI = "1"
          $p = Start-Process "dist/PulsesSwap/PulsesSwap.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $result) { $ok = $true; break }
          }
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Windows WebView 自测 90 秒内没有产出结果"
          }
          Start-Sleep -Seconds 1
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $data = Get-Content $result -Raw | ConvertFrom-Json
          $data.results | ForEach-Object { Write-Host ("[{0}] {1} {2}" -f $(if ($_.ok) {"OK"} else {"FAIL"}), $_.name, $_.detail) }
          if (-not $data.ok) { throw "Windows WebView 功能自测失败" }
          Remove-Item Env:PULSES_WEB_SELFTEST, Env:PULSES_WEB_SELFTEST_JS, Env:PULSES_SELFTEST_PACK -ErrorAction SilentlyContinue
          Write-Host "OK: Windows WebView 实操自测通过"

      - name: Explorer 实机拖拽到 WebView2
        shell: pwsh
        run: |
          $root = Join-Path $PWD "drag-source"
          $pack = Join-Path $root "drag-pack"
          New-Item -ItemType Directory -Force -Path (Join-Path $pack "tacz") | Out-Null
          Set-Content -Path (Join-Path $pack "tacz\drag-gun.zip") -Value "drag-test" -NoNewline
          python packaging/windows_drag_test.py --app "dist/PulsesSwap/PulsesSwap.exe" --source $pack --report (Join-Path $PWD "drag-result.json")
          if (-not (Test-Path "drag-result.json")) { throw "拖拽测试没有结果文件" }
          Get-Content "drag-result.json"

      - name: 启动、等待 UI 并截取 Windows 桌面
        shell: pwsh
        run: |
          $env:PULSES_WEB_CI = "1"
          $p = Start-Process "dist/PulsesSwap/PulsesSwap.exe" -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) {
            throw "打包产物提前退出，exit code = $($p.ExitCode)"
          }
          if ($p.MainWindowHandle -eq 0) {
            throw "进程在运行，但没有主窗口（hidden 启动回归）"
          }
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class WinApi {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          "@
          [WinApi]::ShowWindow($p.MainWindowHandle, 9) | Out-Null
          [WinApi]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path "dist/screenshots" | Out-Null
          $out = "dist/screenshots/windows-ci.png"
          $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bmp.Dispose()
          if (-not (Test-Path $out)) { throw "没有生成桌面截图" }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: Windows UI screenshot -> $out"
      - name: 上传 Windows 桌面截图
        uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Windows-Screenshot
          path: dist/screenshots/windows-ci.png
          if-no-files-found: error
      - name: 上传 Windows 自测结果
        uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Windows-Selftest
          path: selftest-result.json
          if-no-files-found: error
      - name: 上传 Windows 拖拽结果
        uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Windows-Drag
          path: drag-result.json
          if-no-files-found: error

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = (python -c 'import re,pathlib; print(re.search(r"VERSION = \"([^\"]+)\"", pathlib.Path("src/pulses/core/paths.py").read_text(encoding="utf-8")).group(1))').Trim()
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 下载 WebView2 Bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "packaging/MicrosoftEdgeWebview2Setup.exe"
      - name: 编译安装器
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "packaging\installer.iss" "/DMyAppVersion=$v"
      - name: 绿色版
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "dist/portable/PulsesSwap-$v"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/PulsesSwap/*" $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "dist/portable/PulsesSwap-Portable-$v.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Web-Windows
          path: |
            dist/installer/*.exe
            dist/portable/*.zip
            dist/screenshots/*.png

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建前端
        working-directory: src/pulses_web/web
        run: |
          npm ci --include=dev
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0
          pip install -r requirements-web.txt pyinstaller
      - name: PyInstaller
        run: pyinstaller packaging/pulses_web.spec --noconfirm --clean
      - name: 打包
        run: |
          cd dist && tar -czf PulsesSwap-linux-x86_64.tar.gz PulsesSwap
      - uses: actions/upload-artifact@v4
        with:
          name: PulsesSwap-Web-Linux
          path: dist/PulsesSwap-linux-x86_64.tar.gz

  ui:
    # Playwright 1.56 不支持 ubuntu-latest 已迁移到的 26.04；固定 22.04。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装前端依赖
        working-directory: src/pulses_web/web
        run: npm ci --include=dev
      - name: 构建前端
        working-directory: src/pulses_web/web
        run: npm run build
      - name: 安装 Playwright Chromium
        working-directory: src/pulses_web/web
        run: npx playwright install --with-deps chromium
      - name: 黑盒 UI 测试
        working-directory: src/pulses_web/web
        run: |
          python3 -m http.server 8765 -d dist &
          sleep 1
          node test-ui.mjs
          node test-layout.mjs

  release:
    needs: [windows, linux, ui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.png" \) -exec cp {} release/ \;
          git archive --format=zip --prefix=PulsesSwap/ -o "release/PulsesSwap-src-${GITHUB_REF_NAME}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          name: Pulses Swap ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
